
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Teachable Machine Image Model</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        #preview {
            max-width: 300px;
            max-height: 300px;
            margin: 20px auto;
            display: none;
        }

        #label-container {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Teachable Machine Image Model</h2>

    <input type="file" id="imageUpload" accept="image/*">

    <br>

    <img id="preview" alt="Uploaded image">

    <div id="label-container"></div>

    <script>
        const URL = "./my_model/";

        let model;

        // โหลดโมเดล
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
        }

        // อัปโหลดรูปภาพ
        document.getElementById("imageUpload").addEventListener("change", async function(event) {

            const file = event.target.files[0];

            if (!file) return;

            const preview = document.getElementById("preview");
            const labelContainer = document.getElementById("label-container");

            preview.src = URL.createObjectURL(file);

            preview.onload = async function() {

                preview.style.display = "block";

                labelContainer.innerHTML = "กำลังวิเคราะห์ภาพ...";

                if (!model) {
                    await init();
                }

                // วิเคราะห์รูปภาพ
                const prediction = await model.predict(preview);

                labelContainer.innerHTML = "";

                for (let i = 0; i < prediction.length; i++) {

                    const result = document.createElement("div");

                    result.innerHTML =
                        prediction[i].className + ": " +
                        (prediction[i].probability * 100).toFixed(2) + "%";

                    labelContainer.appendChild(result);
                }
            };
        });
    </script>

</body>
</html>

</body>
</html>
